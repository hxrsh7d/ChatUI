# Serves the built ChatUI static assets and proxies API traffic to the
# backend container (Docker Compose service name "backend"). This mirrors
# what Vite's dev server proxy (vite.config.ts) does for local development.
#
# `proxy_buffering off` and friends are required for /api/chat's
# Server-Sent Events stream -- without them nginx buffers the whole
# response before sending anything to the browser, which breaks streaming.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 300s;
    }

    location /v1/ {
        proxy_pass http://backend:8000/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    # Client-side routing fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
